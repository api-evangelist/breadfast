aid: breadfast
name: Breadfast
description: >-
  Breadfast is an Egyptian quick-commerce and online grocery platform, founded in
  2017 in Cairo by Mostafa Amin, Muhammad Habib, and Abdallah Nofal. It delivers
  groceries, freshly baked bread, dairy, fresh produce, ready-to-eat meals,
  household essentials, pharmacy, and beauty products — more than 7,000 SKUs — to
  customers in roughly 60 minutes through a vertically integrated network of dark
  stores and company-owned bakeries, and also operates Breadfast Pay fintech
  services. The company serves 300,000+ active users across Cairo, Giza,
  Alexandria, and Mansoura and processes close to a million orders a month.
  Breadfast runs a consumer WordPress/WooCommerce marketing site and native
  iOS/Android apps and does not publish a public developer API; this profile
  tracks the company in the API Evangelist network.
